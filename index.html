<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paris Shoes & Bags</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Tahoma, sans-serif;
  background: #faf8f5;
  color: #222;
}

header {
  background: #111;
  color: #fff;
  text-align: center;
  padding: 24px 15px;
}

.logo {
  font-size: 34px;
  letter-spacing: 4px;
  font-weight: bold;
}

.subtitle {
  color: #d4af37;
  font-size: 13px;
  letter-spacing: 2px;
  margin-top: 5px;
}

.hero {
  text-align: center;
  padding: 35px 15px 25px;
}

.hero h1 {
  margin: 0 0 10px;
  font-size: 27px;
}

.hero p {
  margin: 0;
  color: #777;
}

.product {
  max-width: 480px;
  margin: 20px auto 40px;
  background: #fff;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.product-image {
  width: 100%;
  height: 390px;
  object-fit: cover;
  display: block;
}

.product-info {
  padding: 20px;
}

.product-info h2 {
  margin: 0 0 8px;
  font-size: 23px;
}

.description {
  color: #777;
  line-height: 1.7;
  margin-bottom: 12px;
}

.price {
  font-size: 23px;
  font-weight: bold;
  color: #b28a19;
  margin: 12px 0 20px;
}

.label {
  font-weight: bold;
  margin: 15px 0 8px;
}

.options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.option {
  border: 1px solid #ddd;
  background: #fff;
  padding: 10px 15px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
}

.option.active {
  background: #111;
  color: #fff;
  border-color: #111;
}

.quantity {
  width: 80px;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  text-align: center;
}

.add-cart {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #111;
  color: #fff;
  font-size: 17px;
  cursor: pointer;
}

.checkout {
  display: none;
  max-width: 480px;
  margin: 20px auto 50px;
  background: #fff;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.checkout h2 {
  margin-top: 0;
}

.cart-box {
  background: #faf8f5;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
  line-height: 1.8;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  margin: 6px 0 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  font-family: inherit;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.whatsapp {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #25D366;
  color: #fff;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

footer {
  text-align: center;
  background: #111;
  color: #fff;
  padding: 25px 15px;
  margin-top: 30px;
}

.location {
  color: #d4af37;
  margin-top: 8px;
}
</style>
</head>

<body>

<header>
  <div class="logo">PARIS</div>
  <div class="subtitle">SHOES & BAGS</div>
</header>

<section class="hero">
  <h1>اختاري أناقتك مع باريس</h1>
  <p>أحذية وشنط بتفاصيل تليق بيكي</p>
</section>

<section class="product">

  <img id="productImage"
       class="product-image"
       src="IMG_0991.png"
       alt="شوز طبي سيليكون">

  <div class="product-info">

    <h2>شوز طبي سيليكون</h2>

    <div class="description">
      خفيف ومريح جدًا، مناسب للاستخدام اليومي،
      بتصميم شيك وفورمال.
    </div>

    <div class="price">550 جنيه</div>

    <div class="label">اختاري اللون:</div>

    <div class="options">

      <button class="option active"
              onclick="chooseColor('هافان','IMG_0991.png',this)">
        هافان
      </button>

      <button class="option"
              onclick="chooseColor('كافيه','IMG_0993.png',this)">
        كافيه
      </button>

      <button class="option"
              onclick="chooseColor('أسود','IMG_0992.png',this)">
        أسود
      </button>

    </div>

    <div class="label">اختاري المقاس:</div>

    <div class="options">

      <button class="option"
              onclick="chooseSize('39',this)">39</button>

      <button class="option"
              onclick="chooseSize('40',this)">40</button>

      <button class="option"
              onclick="chooseSize('41',this)">41</button>

      <button class="option"
              onclick="chooseSize('42',this)">42</button>

      <button class="option"
              onclick="chooseSize('43',this)">43</button>

    </div>

    <div class="label">الكمية:</div>

    <input
      id="quantity"
      class="quantity"
      type="number"
      min="1"
      value="1">

    <button class="add-cart" onclick="addToCart()">
      🛒 أضف للسلة
    </button>

  </div>
</section>

<section id="checkout" class="checkout">

  <h2>إتمام الطلب</h2>

  <div id="cartBox" class="cart-box"></div>

  <label>الاسم</label>
  <input id="customerName" type="text" placeholder="اكتب اسمك">

  <label>رقم الموبايل</label>
  <input id="customerPhone" type="tel" placeholder="01xxxxxxxxx">

  <label>المحافظة</label>
  <select id="governorate">
    <option value="">اختار المحافظة</option>
    <option>مطروح</option>
    <option>الإسكندرية</option>
    <option>القاهرة</option>
    <option>الجيزة</option>
    <option>البحيرة</option>
    <option>الشرقية</option>
    <option>الدقهلية</option>
    <option>الغربية</option>
    <option>المنوفية</option>
    <option>القليوبية</option>
    <option>كفر الشيخ</option>
    <option>دمياط</option>
    <option>بورسعيد</option>
    <option>الإسماعيلية</option>
    <option>السويس</option>
    <option>الفيوم</option>
    <option>بني سويف</option>
    <option>المنيا</option>
    <option>أسيوط</option>
    <option>سوهاج</option>
    <option>قنا</option>
    <option>الأقصر</option>
    <option>أسوان</option>
    <option>البحر الأحمر</option>
    <option>الوادي الجديد</option>
    <option>شمال سيناء</option>
    <option>جنوب سيناء</option>
  </select>

  <label>العنوان بالتفصيل</label>
  <textarea id="address" placeholder="المنطقة - الشارع - رقم العمارة - الدور"></textarea>

  <label>ملاحظات إضافية (اختياري)</label>
  <textarea id="notes" placeholder="أي ملاحظات على الطلب"></textarea>

  <button class="whatsapp" onclick="sendOrder()">
    💬 تأكيد الطلب عبر واتساب
  </button>

</section>

<footer>
  <div>PARIS SHOES & BAGS</div>
  <div class="location">📍 شارع إسكندرية - مرسى مطروح</div>
  <div style="margin-top:8px;">متاح توصيل لأي مكان في مصر</div>
</footer>

<script>

let selectedColor = "هافان";
let selectedSize = "";

function chooseColor(color, image, button) {

  selectedColor = color;

  document.getElementById("productImage").src = image;

  document.querySelectorAll(".options button").forEach(function(btn) {
    if (
      btn.textContent.includes("هافان") ||
      btn.textContent.includes("كافيه") ||
      btn.textContent.includes("أسود")
    ) {
      btn.classList.remove("active");
    }
  });

  button.classList.add("active");
}

function chooseSize(size, button) {

  selectedSize = size;

  document.querySelectorAll(".options button").forEach(function(btn) {
    if (
      ["39","40","41","42","43"].includes(btn.textContent.trim())
    ) {
      btn.classList.remove("active");
    }
  });

  button.classList.add("active");
}

function addToCart() {

  if (selectedSize === "") {
    alert("من فضلك اختاري المقاس أولاً");
    return;
  }

  const quantity = document.getElementById("quantity").value;

  if (quantity < 1) {
    alert("من فضلك اختاري كمية صحيحة");
    return;
  }

  const total = 550 * quantity;

  document.getElementById("cartBox").innerHTML =
    "<strong>المنتج:</strong> شوز طبي سيليكون<br>" +
    "<strong>اللون:</strong> " + selectedColor + "<br>" +
    "<strong>المقاس:</strong> " + selectedSize + "<br>" +
    "<strong>الكمية:</strong> " + quantity + "<br>" +
    "<strong>الإجمالي:</strong> " + total + " جنيه";

  document.getElementById("checkout").style.display = "block";

  document.getElementById("checkout").scrollIntoView({
    behavior: "smooth"
  });
}

function sendOrder() {

  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const governorate = document.getElementById("governorate").value;
  const address = document.getElementById("address").value.trim();
  const notes = document.getElementById("notes").value.trim();
  const quantity = document.getElementById("quantity").value;

  if (!name || !phone || !governorate || !address) {
    alert("من فضلك اكتبي الاسم والموبايل والمحافظة والعنوان");
    return;
  }

  if (!selectedSize) {
    alert("من فضلك اختاري المقاس");
    return;
  }

  const total = 550 * quantity;

  const message =
`🛍️ طلب جديد من موقع باريس

👟 المنتج: شوز طبي سيليكون
🎨 اللون: ${selectedColor}
📏 المقاس: ${selectedSize}
🔢 الكمية: ${quantity}
💰 الإجمالي: ${total} جنيه

👤 اسم العميل: ${name}
📱 رقم الموبايل: ${phone}
📍 المحافظة: ${governorate}
🏠 العنوان: ${address}
📝 ملاحظات: ${notes || "لا يوجد"}

Paris Shoes & Bags`;

  const whatsappNumber = "201098251580";

  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.location.href = whatsappURL;
}

</script>

</body>
</html>
